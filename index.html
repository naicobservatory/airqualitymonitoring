<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Quality Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { box-sizing: border-box; }
    * { font-family: 'Space Grotesk', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ── DENR EMB Official 6-tier AQI Colors (DAO 2020-14) ── */
    .aqi-good { background: linear-gradient(135deg, #00E400 0%, #00a800 100%); box-shadow: 0 0 40px rgba(0, 228, 0, 0.3); }
    .aqi-fair { background: linear-gradient(135deg, #FFFF00 0%, #cccc00 100%); box-shadow: 0 0 40px rgba(255, 255, 0, 0.25); }
    .aqi-unhealthy-sensitive { background: linear-gradient(135deg, #FF7E00 0%, #cc6500 100%); box-shadow: 0 0 40px rgba(255, 126, 0, 0.3); }
    .aqi-very-unhealthy { background: linear-gradient(135deg, #FF0000 0%, #cc0000 100%); box-shadow: 0 0 40px rgba(255, 0, 0, 0.3); }
    .aqi-acutely-unhealthy { background: linear-gradient(135deg, #8F3F97 0%, #682c6e 100%); box-shadow: 0 0 40px rgba(143, 63, 151, 0.3); }
    .aqi-emergency { background: linear-gradient(135deg, #7E0023 0%, #4a0014 100%); box-shadow: 0 0 40px rgba(126, 0, 35, 0.4); }

    .pulse-ring { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse-ring { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }

    .data-refresh { animation: refresh-pulse 0.5s ease-out; }
    @keyframes refresh-pulse { 0% { opacity: 0.5; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1); } }

    .live-dot { animation: live-blink 1.5s ease-in-out infinite; }
    @keyframes live-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .grid-bg { background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 50px 50px; }

    .recommendation-box { background: rgba(255, 255, 255, 0.02); border-left: 3px solid currentColor; }
    .recommendation-item { display: flex; gap: 12px; padding: 10px 0; }
    .recommendation-item .icon { flex-shrink: 0; width: 20px; margin-top: 2px; font-size: 18px; line-height: 1; }

    .tab-button { cursor: pointer; }
    .tab-button.active { color: white; border-color: #00E400; }
    .tab-content { animation: fadeIn 0.3s ease-in; }
    .tab-content.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    .comparison-box { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); }
    .pm-size-visualization { background: linear-gradient(to right, rgba(255,255,255,0.05), rgba(255,255,255,0.02)); border-radius: 0.5rem; padding: 2rem 1rem; text-align: center; }
    .particle-dot-large { display: inline-block; width: 32px; height: 32px; border-radius: 50%; margin: 0 4px; }
    .particle-dot-small { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 4px; }
    .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .feature-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 0.75rem; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .feature-label { font-size: 0.875rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .feature-value { font-size: 1.25rem; font-weight: 600; color: #f1f5f9; }

    .aqi-fair .aqi-text-adaptive { color: #1a1a1a !important; }
    .aqi-fair .aqi-text-muted    { color: rgba(0,0,0,0.6) !important; }
  </style>
</head>
<body class="h-full bg-slate-950 text-white overflow-auto">
<div class="min-h-full w-full grid-bg relative">
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 p-6 md:p-8 max-w-6xl mx-auto">
    <header class="mb-8">
      <div class="flex items-center justify-between flex-wrap gap-4">
        <div>
          <div class="flex items-center gap-3 mb-2">
            <div id="status-indicator" class="w-3 h-3 rounded-full bg-emerald-400 live-dot"></div>
            <span id="status-text" class="text-xs uppercase tracking-widest text-slate-400">Live Data</span>
          </div>
          <h1 id="location-title" class="text-2xl md:text-3xl font-bold text-white">NAIC Air Quality Station</h1>
          <p id="station-info" class="text-slate-400 text-sm mt-1">Real-time Environmental Monitoring System</p>
        </div>
        <div class="flex flex-col items-end gap-3">
          <div class="relative group">
            <label class="flex items-center gap-3 cursor-pointer group">
              <span id="event-mode-label" class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">Rapid Update</span>
              <div id="event-mode-toggle" class="relative w-12 h-6 bg-slate-700 rounded-full transition-all duration-300 group-hover:bg-slate-600" style="background: rgb(55,65,81);">
                <div id="toggle-dot" class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-all duration-300 shadow-lg"></div>
              </div>
            </label>
          </div>
          <div>
            <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Last Updated</div>
            <div id="update-time" class="mono text-lg text-slate-300">--:--:--</div>
          </div>
        </div>
      </div>
    </header>

    <div id="main-aqi-card" class="glass-card rounded-2xl p-6 md:p-8 mb-6 aqi-good relative overflow-hidden">
      <div class="absolute inset-0 pulse-ring bg-white/5 rounded-2xl"></div>
      <div class="relative z-10">
        <div class="flex items-center justify-between flex-wrap gap-4 mb-4">
          <div>
            <div id="aqi-label" class="aqi-text-muted text-white/70 text-sm uppercase tracking-wider mb-1">Overall Air Quality Index (24-hr Average)</div>
            <div id="aqi-status" class="aqi-text-adaptive text-2xl md:text-3xl font-bold text-white">Good</div>
          </div>
          <div class="text-right">
            <div id="main-aqi-value" class="aqi-text-adaptive mono text-6xl md:text-7xl font-bold text-white">--</div>
            <div class="aqi-text-muted text-white/70 text-sm">AQI</div>
          </div>
        </div>
        <p id="health-message" class="aqi-text-muted text-white/80 text-sm md:text-base">None.</p>
      </div>
    </div>

    <div class="mb-6 border-b border-white/10">
      <div class="flex gap-0 overflow-x-auto">
        <button id="tab-recommendations" class="tab-button px-4 py-3 text-white font-medium border-b-2 border-emerald-400 transition-all text-sm md:text-base whitespace-nowrap">Recommendations</button>
        <button id="tab-pm-comparison" class="tab-button px-4 py-3 text-slate-400 font-medium border-b-2 border-transparent hover:text-white transition-all text-sm md:text-base whitespace-nowrap">PM2.5 vs PM10</button>
        <button id="tab-education" class="tab-button px-4 py-3 text-slate-400 font-medium border-b-2 border-transparent hover:text-white transition-all text-sm md:text-base whitespace-nowrap">Learn About AQI</button>
      </div>
    </div>

    <div id="recommendations-section" class="tab-content glass-card rounded-2xl p-6 md:p-8 mb-6">
      <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">Health &amp; Activity Recommendations</h2>
      <div id="recommendations-content" class="space-y-4"></div>
    </div>

    <div id="pm-comparison-section" class="tab-content hidden"></div>
    <div id="education-section" class="tab-content hidden"></div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div class="glass-card rounded-xl p-5 relative overflow-hidden">
        <div class="flex items-start justify-between mb-4">
          <div><div class="text-sm font-medium">PM2.5</div></div>
          <div id="pm25-badge" class="px-2 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-400">Good</div>
        </div>
        <div class="text-4xl font-bold mono" id="pm25-aqi">--</div>
        <div class="h-1.5 bg-slate-800 rounded-full mt-4"><div id="pm25-bar" class="h-full bg-emerald-400 rounded-full" style="width:0%"></div></div>
      </div>
      <div class="glass-card rounded-xl p-5 relative overflow-hidden">
        <div class="flex items-start justify-between mb-4">
          <div><div class="text-sm font-medium">PM10</div></div>
          <div id="pm10-badge" class="px-2 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-400">Good</div>
        </div>
        <div class="text-4xl font-bold mono" id="pm10-aqi">--</div>
        <div class="h-1.5 bg-slate-800 rounded-full mt-4"><div id="pm10-bar" class="h-full bg-emerald-400 rounded-full" style="width:0%"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
  let eventModeActive = false;
  
  function getDENRCategory(aqi) {
    if (aqi === null || isNaN(aqi)) return null;
    if (aqi <= 50) return { key: 'good', status: 'Good', cardClass: 'aqi-good', badgeClass: 'bg-green-500/20 text-green-400', barClass: 'bg-emerald-400', message: 'None' };
    if (aqi <= 100) return { key: 'fair', status: 'Fair', cardClass: 'aqi-fair', badgeClass: 'bg-yellow-400/20 text-yellow-600', barClass: 'bg-yellow-400', message: 'None', fairText: true };
    if (aqi <= 150) return { key: 'unhealthySensitive', status: 'Unhealthy for Sensitive Groups', cardClass: 'aqi-unhealthy-sensitive', badgeClass: 'bg-orange-500/20 text-orange-400', barClass: 'bg-orange-500', message: 'People with respiratory diseases, such as asthma, should limit outdoor exertion.' };
    if (aqi <= 200) return { key: 'veryUnhealthy', status: 'Very Unhealthy', cardClass: 'aqi-very-unhealthy', badgeClass: 'bg-red-500/20 text-red-400', barClass: 'bg-red-500', message: 'Pedestrians should avoid heavy traffic areas.' };
    if (aqi <= 300) return { key: 'acutelyUnhealthy', status: 'Acutely Unhealthy', cardClass: 'aqi-acutely-unhealthy', badgeClass: 'bg-purple-500/20 text-purple-300', barClass: 'bg-purple-500', message: 'People should limit outdoor exertion.' };
    return { key: 'emergency', status: 'Emergency', cardClass: 'aqi-emergency', badgeClass: 'bg-red-900/30 text-red-300', barClass: 'bg-red-900', message: 'Everyone should remain indoors.' };
  }

  async function fetchSensorData() {
    try {
      const response = await fetch('https://script.googleusercontent.com/macros/echo?user_content_key=AehSKLhAH0dXaoHYko7OJ1-Ji-j2PA9D-9A1X1K0hNc2wyUev92IcnJwuD2eBKugqi1PiMbZwnVc7MZfvuwtKCrMmPa67hNrUm-0q8S1CGpXXjcV8z86-56SKBKCb7jthHm1Oc9IigHmZzitbmVyap_D1bKBNk9nxUTKbzwKUJBzgBOzX925-u9CI476YP-DYrbTBaT3DXLlEf2AGHws59dvSAwdaSSfpTpNxfw9tQEW7XudtSCgTs26IVOsep3RrHLO5H0MBpmZFZJ0hhQ_hBoTVdmsjMuQWPDZAsE98Lf_&lib=MTbhs9Zv5KTG9ImKpSDDDPCIObk80Qa1W');
      const data = await response.json();
      const raw = data.raw_data?.data || {};
      
      return {
        pm25AQI: eventModeActive ? parseFloat(raw.pm25_aqi_combo?.real_time_aqi?.value) : parseFloat(raw.pm25_aqi_combo?.['24_hours_aqi']?.value),
        pm10AQI: eventModeActive ? parseFloat(raw.pm10_aqi_combo?.real_time_aqi?.value) : parseFloat(raw.pm10_aqi_combo?.['24_hours_aqi']?.value),
        timestamp: new Date()
      };
    } catch (e) { console.error(e); return { pm25AQI: null, pm10AQI: null, timestamp: new Date() }; }
  }

  function updateDisplay(data) {
    document.getElementById('update-time').textContent = data.timestamp.toLocaleTimeString();
    const overall = Math.max(data.pm25AQI || 0, data.pm10AQI || 0);
    const cat = getDENRCategory(overall);
    
    // Update main card
    document.getElementById('main-aqi-card').className = `glass-card rounded-2xl p-6 mb-6 ${cat.cardClass}`;
    document.getElementById('main-aqi-value').textContent = Math.round(overall);
    document.getElementById('aqi-status').textContent = cat.status;
    document.getElementById('health-message').textContent = cat.message;

    // Update PM cards
    if (data.pm25AQI !== null) {
      document.getElementById('pm25-aqi').textContent = Math.round(data.pm25AQI);
      document.getElementById('pm25-badge').textContent = getDENRCategory(data.pm25AQI).status;
      document.getElementById('pm25-bar').style.width = Math.min((data.pm25AQI / 400) * 100, 100) + '%';
    }
    // (Repeat similar logic for PM10)
  }

  document.getElementById('event-mode-toggle').addEventListener('click', async () => {
    eventModeActive = !eventModeActive;
    const data = await fetchSensorData();
    updateDisplay(data);
  });

  // Init
  fetchSensorData().then(updateDisplay);
  setInterval(async () => updateDisplay(await fetchSensorData()), 30000);
</script>
</body>
</html>
